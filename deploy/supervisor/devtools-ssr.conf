; SSR do Inertia (devtools.natanfiuza.dev.br).
;
; O `inertia:start-ssr` sobe um processo node com o bundle de
; bootstrap/ssr; sem ele as paginas continuam funcionando (o Inertia cai
; para o render no cliente), mas perde-se o HTML pronto e o SEO.
;
; Ligado por INERTIA_SSR_ENABLED=true no .env: o supervisor sobe o
; processo, e o Laravel so tenta usa-lo quando a chave esta ligada.
;
; O bundle e trocado pelo deploy.sh, que reinicia este programa para o
; processo novo carregar o codigo novo (autorestart garante que ele volte).

[program:devtools-ssr]
command=php /var/www/devtools/artisan inertia:start-ssr
directory=/var/www/devtools
user=www-data
autostart=true
autorestart=true

; stopasgroup/killasgroup: o artisan e apenas o pai - o servidor de
; verdade e um processo node filho. Sem o grupo inteiro, o node fica
; orfao segurando a porta 13714 e o restart seguinte falha.
stopasgroup=true
killasgroup=true
stopwaitsecs=15

; O supervisor nao herda o PATH do shell de login: sem isto o artisan
; pode nao encontrar o node ao subir o servidor.
environment=PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",NODE_ENV="production"

redirect_stderr=true
stdout_logfile=/var/www/devtools/storage/logs/ssr.log
